# Commands measured by bench/compile/measure.jl. No SSH.
# Scripts live under bench/compile/fixtures. Child cwd is the repo root so the
# CLI project root matches the Manifest (worker environment verification).
# `{work}` is a fresh copy of fixtures for config/store paths; `{store}` is a fresh jobs file.
package = "DistSSHQueue"

[[command]]
name = "help"
args = ["--help"]

[[command]]
name = "status"
args = ["status"]

[command.env]
# A runner has no `setup`. Without this, `status` exits 1.
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_STORE = "{store}"

[[command]]
name = "submit"
args = ["submit", "go", "--head-slots", "1", "bench/compile/fixtures/jobenv/hello.jl"]

[command.env]
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_NO_STAGE = "1"
DISTSSHQUEUE_NO_KIT_SETUP = "1"
DISTSSHQUEUE_CONFIG = "{work}/config.toml"
DISTSSHQUEUE_STORE = "{store}"

[[command]]
name = "watch"
args = ["watch", "--interval", "0.05"]

[command.env]
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_NO_STAGE = "1"
DISTSSHQUEUE_NO_KIT_SETUP = "1"
DISTSSHQUEUE_CONFIG = "{work}/config.toml"
DISTSSHQUEUE_STORE = "{store}"
DISTSSHQUEUE_WATCH_TICKS = "1"

[[command]]
name = "cancel"
args = ["cancel", "11111111-1111-1111-1111-111111111111"]
store = "fixtures/queued.toml"

[command.env]
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_NO_STAGE = "1"
DISTSSHQUEUE_NO_KIT_SETUP = "1"
DISTSSHQUEUE_CONFIG = "{work}/config.toml"
DISTSSHQUEUE_STORE = "{store}"
