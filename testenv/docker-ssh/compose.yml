# Linux SSH children for DistSSHQueue local Docker E2E.
# These are DistSSHKit go/drive targets (`child:NAME[:N]`). The queue host and the
# serve run on the host, not here.
#
# Project name is not the directory (`docker-ssh`): DistSSHKit uses the same
# folder name, and sharing the Compose project recreates Kit's children too.
name: distsshqueue-docker-ssh
services:
  child-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JULIA_CHANNEL: ${JULIA_CHANNEL:-1.13}
        JULIA_RELEASE: ${JULIA_RELEASE:-}
    image: local/distsshqueue-linux-ssh-worker:latest
    container_name: distsshqueue-child-1
    ports:
      - "2222:22"
    volumes:
      - ./mounted-keys:/mounted-keys:ro
    restart: "no"

  child-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JULIA_CHANNEL: ${JULIA_CHANNEL:-1.13}
        JULIA_RELEASE: ${JULIA_RELEASE:-}
    image: local/distsshqueue-linux-ssh-worker:latest
    container_name: distsshqueue-child-2
    ports:
      - "2223:22"
    volumes:
      - ./mounted-keys:/mounted-keys:ro
    restart: "no"
