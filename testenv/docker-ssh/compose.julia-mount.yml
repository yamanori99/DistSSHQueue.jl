# Optional overlay: mount the queue host's Julia prefix into workers at the
# same absolute path so DistSSHRun env-verify sees matching sysimage paths
# (GHA hostedtoolcache vs in-container juliaup). up.sh adds -f when
# DISTSSHQUEUE_HOST_JULIA_PREFIX is set.
services:
  child-1:
    environment:
      DISTSSHQUEUE_HOST_JULIA_PREFIX: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
    volumes:
      - type: bind
        source: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
        target: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
        read_only: true
  child-2:
    environment:
      DISTSSHQUEUE_HOST_JULIA_PREFIX: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
    volumes:
      - type: bind
        source: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
        target: ${DISTSSHQUEUE_HOST_JULIA_PREFIX}
        read_only: true