name = "ExampleJob"
uuid = "b1a9f0d2-3c4e-4f5a-9b6c-7d8e9f0a1b2c"
version = "0.0.1"

# Host project `setup!` ships this tree to workers. Job scripts are copied from
# DistSSHRun `demos/` at E2E start (not kept in git). with_kit drivers `using DistSSHRun`.
# SSH E2E copies this tree to an isolated git root; `test/e2e.jl` then aligns its
# DistSSHRun lock to the workspace root `Manifest.toml` (runner uses `--project=test`).
# Drop the `[sources]` entry at the 0.10.0 cut, after DistSSHRun 0.2.0 is on General.
[deps]
DistSSHRun = "b568025c-2759-4ef1-8b14-17d00e2cd000"
Distributed = "8ba89e20-285c-5b6f-9357-94700520ee1b"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[sources]
DistSSHRun = { url = "https://github.com/yamanori99/DistSSHRun.jl", rev = "breaking/snapshot-vocabulary-pr3-ff28" }

[compat]
DistSSHRun = "0.2"
Distributed = "1.11"
Random = "1.11"
