name: E2E weekly

# Not on pull_request: skipped macOS/WSL jobs would show on every PR, and
# job-name expressions do not expand when skipped.
# Daily 04:00 JST and workflow_dispatch. A version-and-NEWS main push
# does not start this matrix. Register from cut PR Linux E2E.
# `cut-hold` when scheduled Linux is red. Intel / WSL do not add it.
on:
  workflow_dispatch:
  # Daily 04:00 JST (UTC 19:00). Misses CI weekly (daily 06:00 JST).
  # GitHub often delays cron; start early so it still finishes before morning.
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: ssh-e2e-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest (image)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh build + push
        env:
          DISTSSHQUEUE_PUSH_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshqueue-linux-ssh-worker:${{ github.sha }}
          DISTSSHQUEUE_SKIP_UP: "1"
        run: ./testenv/docker-ssh/scripts/up.sh
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  linux-e2e:
    needs: linux-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: ubuntu-latest → ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Codecov OIDC (E2E coverage; not on PR E2E)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: test
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHQUEUE_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshqueue-linux-ssh-worker:${{ github.sha }}
          DISTSSHQUEUE_WORKER_PULL_RETRIES: "8"
          DISTSSHQUEUE_CODE_COVERAGE: "1"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' }}
      # SHA from the image job; latest after this Linux suite (package should be public).
      - name: Push latest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/distsshqueue-linux-ssh-worker
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" local/distsshqueue-linux-ssh-worker:latest
          ./testenv/docker-ssh/scripts/push-image.sh "${IMAGE}:latest"
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  macos-e2e:
    needs: linux-image
    runs-on: macos-15-intel
    timeout-minutes: 60
    name: macos-15-intel → ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: test
      - name: Colima
        run: ./testenv/docker-ssh/scripts/setup-colima-ci.sh
      - name: Log in to GHCR
        run: |
          attempt=1
          max=5
          delay=5
          until echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; do
            if (( attempt >= max )); then
              echo "docker login failed after ${max} attempts" >&2
              exit 1
            fi
            echo "docker login failed (${attempt}/${max}); retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHQUEUE_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshqueue-linux-ssh-worker:${{ github.sha }}
          DISTSSHQUEUE_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  wsl-e2e:
    needs: linux-image
    runs-on: windows-latest
    timeout-minutes: 60
    name: windows-latest (WSL2) → ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml') }}
          # No restore-keys: a prefix hit would unpack an older Julia's julia.tgz.
      - name: GHCR token for WSL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          mkdir -p .ci-cache
          printf '%s' "$GHCR_TOKEN" > .ci-cache/ghcr.token
          printf '%s' "$GHCR_ACTOR" > .ci-cache/ghcr.actor
      # wsl-bash does not inherit Actions env (set -u → unbound GITHUB_TOKEN).
      - name: docker-ssh up + SSH E2E in WSL2
        shell: wsl-bash {0}
        run: |
          bash ./.github/wsl-apt.sh ca-certificates curl git rsync openssh-client openssh-server docker.io docker-compose-v2 iptables
          src="$(pwd)"
          dest="$HOME/DistSSHQueue.jl"
          cache="$src/.ci-cache/wsl-julia"
          export DISTSSHQUEUE_WORKER_IMAGE="ghcr.io/${{ github.repository_owner }}/distsshqueue-linux-ssh-worker:${{ github.sha }}"
          export DISTSSHQUEUE_WORKER_PULL_RETRIES="8"
          mkdir -p "$cache"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          actor="$(cat "$src/.ci-cache/ghcr.actor")"
          echo "$(cat "$src/.ci-cache/ghcr.token")" | docker login ghcr.io -u "$actor" --password-stdin
          rm -f "$src/.ci-cache/ghcr.token" "$src/.ci-cache/ghcr.actor"
          julia_channel=1.13
          # shellcheck source=/dev/null
          source "$dest/testenv/docker-ssh/scripts/retry.sh"
          if [[ -f "$cache/julia.tgz" ]]; then
            tar -xzf "$cache/julia.tgz" -C "$HOME"
          else
            distsshqueue_retry "WSL juliaup install" distsshqueue_install_juliaup "$julia_channel"
          fi
          # Pkg.test packs this tarball as user ci. juliaup's julia symlink is
          # absolute, so it does not run as root until it points at this home.
          if ! distsshqueue_relink_julia; then
            distsshqueue_retry "WSL juliaup install" distsshqueue_install_juliaup "$julia_channel"
            distsshqueue_relink_julia
          fi
          export PATH="$HOME/.juliaup/bin:$PATH"
          # Current patch before the suite starts. A later juliaup version-db
          # check must not delete the install this job is about to run.
          distsshqueue_retry "WSL juliaup update" juliaup update "$julia_channel"
          juliaup default "$julia_channel"
          distsshqueue_relink_julia
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh --e2e
          distsshqueue_relink_julia
          if [[ -d "$HOME/.julia" ]]; then
            tar --exclude='.julia/compiled' -czf "$cache/julia.tgz" -C "$HOME" .juliaup .julia
          else
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup
          fi
      - name: Teardown workers
        if: always()
        shell: wsl-bash {0}
        run: |
          dest="$HOME/DistSSHQueue.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

  # Schedule / post-cut runs are not PR checks, and github-actions[bot] does not email.
  notify:
    needs: [linux-image, linux-e2e, macos-e2e, wsl-e2e]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ contains(join(needs.*.result, ','), 'failure') }}
          LINUX_FAILED: ${{ needs.linux-image.result == 'failure' || needs.linux-e2e.result == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKLY: ${{ github.event_name == 'schedule' }}
        run: |
          title='E2E weekly failed'
          gh label create alert --force --description "Auto: scheduled check failed (E2E weekly, CI weekly, Runic)" --color "ff4d00" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create cut-hold --force --description "Postpone register until scheduled Linux E2E is green" --color "BFD4F2" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$FAILED" = "true" ]; then
            body="Latest run: $RUN_URL

          Not a PR check. Re-run **E2E weekly** after a fix. A red **Linux** job on a scheduled run adds \`cut-hold\` (do not register). Intel / WSL red does not."
            labels=alert
            hold=false
            if [ "$WEEKLY" = "true" ] && [ "$LINUX_FAILED" = "true" ]; then
              labels=alert,cut-hold
              hold=true
            fi
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
              if [ "$hold" = "true" ]; then
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --add-label cut-hold
              else
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --remove-label cut-hold || true
              fi
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$labels" --body "$body"
            fi
          else
            for t in 'E2E weekly failed' 'E2E daily failed'; do
              n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $t" --json number --jq '.[0].number // empty')"
              if [ -n "$n" ]; then
                gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label cut-hold || true
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Latest run succeeded: $RUN_URL"
              fi
            done
          fi
