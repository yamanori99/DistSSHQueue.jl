name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
# A Project.toml version increase (see version-cut.sh) runs 1.14-nightly,
# Aqua on that nightly, and registry tree in this workflow. No label is involved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # `Pkg.test` 1.13 runs on ubuntu-latest, macos-latest, and WSL2 Ubuntu.
  # macOS and WSL are required. The macOS job exercises `enable --write-only`
  # on LaunchAgent (Linux CI takes systemd). Coverage uploads from Ubuntu only.
  # Slow SSH E2E controllers are `E2E weekly`
  # (macos-15-intel Colima, not this job).
  # One detect job; markdown-only / allowlisted PRs skip heavy jobs (UI: skipping).
  # Required check names include the Julia version and the architecture.
  # Codecov (flag pkgtest): main push, Ubuntu 1.13 only — not macos-latest,
  # and not on pull_request.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
  # Aqua / JETLS share this workflow so the Test badge is the PR gate.
  # Linux E2E (1.13): path filter on PR / main push; always on a version
  # increase and dispatch. JETLS uses `.github/actions/jetls-check` (no nested
  # cache; julia-actions/cache#236).
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      version_cut: ${{ steps.heavy.outputs.version_cut }}
      e2e: ${{ steps.gate.outputs.e2e }}
      coverage: ${{ steps.gate.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "src/**"
              - "test/**"
              - "!test/**/*.md"
              - "testenv/**"
              - "!testenv/**/*.md"
              - "Project.toml"
              - "test/Project.toml"
              - ".github/workflows/CI.yml"
      - id: gate
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          CUT: ${{ steps.heavy.outputs.version_cut }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "e2e=${FILTER_E2E}" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CUT" = "true" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi

  test-1-13:
    name: Pkg.test (1.13, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  test-1-13-macos:
    name: Pkg.test (1.13, macos-latest, aarch64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-13-wsl:
    name: Pkg.test (1.13, WSL2 ubuntu-24.04, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@v6
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  test-1-14-nightly:
    name: Pkg.test (1.14-nightly, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-nightly-macos:
    name: Pkg.test (1.14-nightly, macos-latest, aarch64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-nightly-wsl:
    name: Pkg.test (1.14-nightly, WSL2 ubuntu-24.04, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@v6
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly julia --project=. -e 'using Pkg; Pkg.test()'

  # Not required to merge. Catches checkout-only Pkg.test assumptions. Runs on 1.14-nightly.
  test-registry-tree:
    name: Pkg.test (registry, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/registry-tree-test

  aqua-1-13:
    name: Aqua (1.13, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-nightly:
    name: Aqua (1.14-nightly, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-nightly-macos:
    name: Aqua (1.14-nightly, macos-latest, aarch64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-nightly-wsl:
    name: Aqua (1.14-nightly, WSL2 ubuntu-24.04, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@v6
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml') }}
      - name: Aqua.test_all (latest Aqua)
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly ./.github/aqua-check.sh

  # Literal names: skipped matrix jobs leave ${{ matrix.* }} unexpanded.
  # JETLS stays on a runtime it lists (today 1.13). No nightly JETLS.
  jetls-1-13:
    name: JETLS (1.13, ubuntu-latest, x64)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  ssh-e2e:
    name: ubuntu-latest → ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - name: Julia version
        run: julia --version

      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: test

      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHQUEUE_CODE_COVERAGE: ${{ needs.detect.outputs.coverage == 'true' && '1' || '' }}
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' && needs.detect.outputs.coverage == 'true' }}

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true
