name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
# A Project.toml version increase (see version-cut.sh) runs Ubuntu
# nightly, Aqua on nightly, and PkgEval in this workflow.
# 1.14-pre passes julia-slot "~1.14.0-0" (setup-julia) and follows the heavy gate,
# including ordinary pull requests. Registry install does too.
# macOS 1.14-pre Pkg.test follows the heavy gate and is continue-on-error.
# macOS nightly stays on CI weekly. WSL2 1.13 Pkg.test runs on a main
# push and CI weekly, not on a pull request. No label is involved.
# Linux SSH E2E 1.14-pre follows the E2E path filter (continue-on-error).
# A main push that changes only Project.toml, NEWS.md, and changelog.d/**,
# and raises version, skips Test and does not start Linux E2E.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # `Pkg.test` 1.13 on a pull request is ubuntu-latest and xcode-27.
  # WSL2 Ubuntu is a main push and CI weekly, not a pull request.
  # macOS is required. The macOS job exercises `enable --write-only`
  # on LaunchAgent (Linux CI takes systemd). Coverage uploads from Ubuntu only.
  # Slow SSH E2E controllers are `E2E weekly`
  # (macos-15-intel Colima, not this job).
  # One detect job; markdown-only / allowlisted PRs skip heavy jobs (UI: skipping).
  # Required check names include the Julia version and the architecture.
  # Codecov (flag pkgtest): main push, Ubuntu 1.13 only — not xcode-27,
  # and not on pull_request.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
# Aqua / JETLS / Runic share this workflow so the Test badge is the PR gate.
# `.github/workflows/runic.yml` keeps the monthly schedule.
# Runic, JETLS 1.13, and Aqua 1.13 start after detect. Pkg.test, Registry,
# PkgEval, Downstream, and SSH E2E start only after those three succeed.
# An `if` drops the implicit success() check, so each of those jobs names
# needs.*.result == 'success'. 1.14-pre Aqua and JETLS stay
# continue-on-error and do not hold the hosts.
# Linux E2E (1.13 required, 1.14-pre continue-on-error): path filter on PR /
# main push; always on a version
# increase and dispatch. JETLS uses `.github/actions/jetls-check` (no nested
# cache; julia-actions/cache#236).
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      version_cut: ${{ steps.heavy.outputs.version_cut }}
      e2e: ${{ steps.gate.outputs.e2e }}
      coverage: ${{ steps.gate.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "src/**"
              - "test/**"
              - "!test/**/*.md"
              - "testenv/**"
              - "!testenv/**/*.md"
              - "Project.toml"
              - "test/Project.toml"
              - ".github/workflows/CI.yml"
      - id: gate
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          CUT: ${{ steps.heavy.outputs.version_cut }}
          HEAVY: ${{ steps.heavy.outputs.heavy }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$HEAVY" = "false" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "e2e=${FILTER_E2E}" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CUT" = "true" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi

  test-1-13:
    name: Pkg.test (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # The commit under test, installed the way General installs it:
  # packages/<name>/<slug>, read-only files, no gitignored Manifest.
  # Pull requests checkout head.sha, not the merge ref. Not continue-on-error.
  # Add the job name to the main ruleset; this file does not change it.
  registry-install:
    name: Registry install (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request's github.sha is the merge commit. Install the head.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: ./.github/actions/registry-install
        with:
          package: DistSSHQueue
          rev: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  test-1-13-macos:
    name: Pkg.test (1.13, xcode-27, aarch64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-13-wsl:
    name: Pkg.test (1.13, WSL2 ubuntu-24.04, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia.
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  test-1-14-pre:
    name: Pkg.test (1.14-pre, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  # Same heavy gate as Ubuntu 1.14-pre. continue-on-error: not a ruleset
  # check. Runner is xcode-27. Nightly macOS stays on CI weekly.
  test-1-14-pre-macos:
    name: Pkg.test (1.14-pre, xcode-27, aarch64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-nightly:
    name: Pkg.test (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && (github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  # Not required to merge. This checkout inside PkgEval's sandbox, against
  # Julia nightly. Host Julia is 1.13. The sandbox resolves like General.
  # A `[sources]` git rev is not in that sandbox, so this stays red while
  # DistSSHRun is only on its main branch. continue-on-error.
  pkgeval:
    name: PkgEval (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && (github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkgeval
        with:
          package: DistSSHQueue

  # Same check as the monthly workflow. That file no longer runs on a PR
  # or a main push, so this job is the one heavy jobs wait for. Not a
  # ruleset name. A red result skips Pkg.test, so the required checks stay
  # skipping. The job name stays `Runic`.
  runic:
    name: Runic
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: '1'

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre:
    name: Aqua (1.14-pre, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-nightly:
    name: Aqua (nightly, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && (github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  # Literal names: skipped matrix jobs leave ${{ matrix.* }} unexpanded.
  # JETLS 2026-11-04 officially supports 1.12.2 through 1.14.
  # The required job stays on 1.13. 1.14-pre is informational
  # (continue-on-error) and is not a required check. No JETLS on nightly.
  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official x86_64 release target from JuliaCI/julia-buildkite
    # utilities/build_envs.sh (generic, sandybridge, haswell, x86-64-v4).
    # Pkgimages then load on any GitHub-hosted x86_64 runner. Job env only.
    env:
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - name: Log runner CPU
        id: runner
        run: |
          set -euo pipefail
          julia --startup-file=no -e 'println("CPU_NAME=", Sys.CPU_NAME); println("CPU_MODEL=", Sys.cpu_info()[1].model)'
          # Resolved VERSION, not the slot request (~1.14.0-0 stays put across alphas).
          ver="$(julia --startup-file=no -e 'print(VERSION)')"
          # First 12 hex digits of sha256(JULIA_CPU_TARGET). No newline in the input.
          tag="$(printf '%s' "$JULIA_CPU_TARGET" | sha256sum | cut -c1-12)"
          echo "julia=${ver}" >> "$GITHUB_OUTPUT"
          echo "cputarget=${tag}" >> "$GITHUB_OUTPUT"
          echo "jetls-cache: julia=${ver} cputarget=${tag}"
          # Default prefix omits the target and the resolved version, so the
          # native 1.13 depot stays the newest restore. Old caches are left in place.
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cputarget=${{ steps.runner.outputs.cputarget }};julia=${{ steps.runner.outputs.julia }}
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  jetls-1-14-pre:
    name: JETLS (1.14-pre, ubuntu-latest, x64)
    needs: detect
    # Paused until JETLS supports Julia 1.14.0-beta1 (missing jl_datatype_super); restore via companion PR.
    # heavy is only true/false; this sentinel never matches (same effect as if: false).
    if: needs.detect.outputs.heavy == 'jetls-1-14-unpause'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # Same multi-target as the 1.13 job. See that job's env comment.
    env:
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - name: Log runner CPU
        id: runner
        run: |
          set -euo pipefail
          julia --startup-file=no -e 'println("CPU_NAME=", Sys.CPU_NAME); println("CPU_MODEL=", Sys.cpu_info()[1].model)'
          # Resolved VERSION, not the slot request (~1.14.0-0 stays put across alphas).
          ver="$(julia --startup-file=no -e 'print(VERSION)')"
          # First 12 hex digits of sha256(JULIA_CPU_TARGET). No newline in the input.
          tag="$(printf '%s' "$JULIA_CPU_TARGET" | sha256sum | cut -c1-12)"
          echo "julia=${ver}" >> "$GITHUB_OUTPUT"
          echo "cputarget=${tag}" >> "$GITHUB_OUTPUT"
          echo "jetls-cache: julia=${ver} cputarget=${tag}"
          # Same prefix fields as the 1.13 job. An alpha bump changes julia=.
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cputarget=${{ steps.runner.outputs.cputarget }};julia=${{ steps.runner.outputs.julia }}
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  ssh-e2e:
    name: ubuntu-latest → ubuntu-26.04
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - name: Julia version
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHQUEUE_CODE_COVERAGE: ${{ needs.detect.outputs.coverage == 'true' && '1' || '' }}
          DISTSSHQUEUE_BUILD_CACHE: gha
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' && needs.detect.outputs.coverage == 'true' }}

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Same path gate as 1.13. Parent Julia is ~1.14.0-0. Workers follow
  # JULIA_CHANNEL (Queue's name for the image channel). continue-on-error;
  # not a ruleset check. No Codecov upload.
  ssh-e2e-1-14-pre:
    name: ubuntu-latest → ubuntu-26.04 (1.14-pre)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - name: Julia version
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHQUEUE_BUILD_CACHE: gha
          JULIA_CHANNEL: "1.14"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Downstream main, with this checkout developed into its test project.
  # The job name includes `@main` because `ref` below is `main`.
  # Red is correct when this PR needs a downstream change that is not on main
  # yet, or when this version leaves the downstream compat and resolution
  # fails (for example a 0.2 bump).
  downstream:
    name: Downstream (${{ matrix.pkg }}@main, 1.13)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [DistSSHKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/${{ matrix.pkg }}.jl
          ref: main
          path: downstream
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Public Queue names in downstream src
        env:
          DOWNSTREAM_SRC: ${{ github.workspace }}/downstream/src
        run: julia --startup-file=no --project=. .github/downstream_public.jl "$DOWNSTREAM_SRC"
      - name: Pkg.test downstream against this checkout
        env:
          PKG: ${{ matrix.pkg }}
          UPSTREAM: ${{ github.workspace }}
          DOWNSTREAM: ${{ github.workspace }}/downstream
          UPSTREAM_PKG: DistSSHQueue
        run: |
          julia --startup-file=no -e '
            using Pkg
            upstream = ENV["UPSTREAM"]
            downstream = ENV["DOWNSTREAM"]
            name = Symbol(ENV["UPSTREAM_PKG"])
            Pkg.activate(joinpath(downstream, "test"))
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.instantiate()
            Core.eval(Main, Expr(:using, Expr(:., name)))
            dir = pkgdir(getfield(Main, name))
            dir === nothing && error(string(name, " has no pkgdir"))
            loaded = realpath(dir)
            expected = realpath(upstream)
            loaded == expected || error(string(name, " loaded from ", loaded))
            Pkg.activate(downstream)
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.resolve()
            Pkg.test(ENV["PKG"])
          '
