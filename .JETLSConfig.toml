# kwargs is an opaque bag for DistSSHKit execute!.
# runner is the strategy callback (run_kit, or a test double).
[[diagnostic.patterns]]
pattern = "kwargs::Dict\\{String, Any\\}"
match_by = "message"
match_type = "regex"
severity = "off"

[[diagnostic.patterns]]
pattern = "runner::Function"
match_by = "message"
match_type = "regex"
severity = "off"

# SSH E2E is a separate entry. runtests.jl does not include it, because the
# file exits the process. JETLS reports that as toplevel/analysis-skipped.
[[diagnostic.patterns]]
pattern = "toplevel/analysis-skipped"
match_by = "code"
match_type = "literal"
severity = "off"
path = "test/e2e.jl"
